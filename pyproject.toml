[project]
name = "income-lens-ai"
version = "0.1.0"
description = "Auditable income-document underwriting simulation (synthetic data, engineering demo)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: calls a real LLM API (requires OPENAI_API_KEY)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py312"
